<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Gerenciador de Tarefas{% endblock %}</title>
  <!-- Minified version -->
<link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
<!-- Un-Minified version -->
<link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">
<style>
  .flash{
    border: 2px solid black;
  }
    .flash.sucesso {
        color: green;
    } 
    .flash.erro {
        color: red;
    } 

</style>
</head>
<body>
  <header>
    <h1>Gerenciador de Tarefas</h1>
    <nav>
      <a href="{{ url_for('tarefas.principal') }}">Início</a> |
      <a href="{{ url_for('tarefas.inserir_tarefa') }}">Nova Tarefa</a>
    </nav>
  </header>

  <main>
    <!-- 
    O Flash:
    Ele serve para exibir mensagens temporárias para o usuário 
    (como “Tarefa Adicionadas”, “Erro ao enviar!” , "Tarefas alteradas,...).
    -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for categoria, msg in messages %}
          <p class="flash {{ categoria }}">{{ msg }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
