{% extends "base.html" %}
{% block title %}Editar Tarefa{% endblock %}
{% block content %}
<h2>Editar Tarefa</h2>
<form method="post">
  <label>Título:</label>
  <input type="text" name="titulo" value="{{ tarefa.titulo }}" required>

  <label>Descrição:</label>
  <textarea name="descricao">{{ tarefa.descricao }}</textarea>

  <label>
    <input type="checkbox" name="concluida" {% if tarefa.concluida %}checked{% endif %}> Concluída
  </label>

  <button type="submit">Atualizar</button>
</form>
{% endblock %}
